[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-time-control"
version = "0.2.0"
description = "External clock, budget gates, calibration summaries, and deadline enforcement primitives for AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["mcp>=2.2,<2.3", "tzdata>=2025.2; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["jsonschema>=4.20,<5", "PyYAML>=6,<7"]
openai-agents = ["openai-agents>=0.22.3,<0.23"]
release = ["build==1.6.1", "ruff==0.16.9", "coverage==7.16.2"]

[project.scripts]
agent-time-mcp = "agent_time_control.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["agent_time_control"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py310"
