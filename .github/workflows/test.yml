name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,openai-agents]' ruff
      - run: ruff check src scripts evals tests
      - run: ruff format --check src scripts evals tests
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts evals tests
