name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.14"}
          - {os: macos-latest, python-version: "3.14"}
          - {os: windows-latest, python-version: "3.12"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # Prove the release extra supplies its backend even on pre-seeded runners.
      - run: python -m pip uninstall -y setuptools wheel
      - run: python -m pip install -e '.[test,openai-agents,release]'
      - run: python scripts/validate_release.py --output release-validation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-validation-${{ matrix.os }}-py${{ matrix.python-version }}
          path: release-validation/
          if-no-files-found: error
